# Temple of Two — contact-form Worker.
# Deploy:  cd contact-worker && npx wrangler deploy
# Secrets: npx wrangler secret put RESEND_API_KEY
#          npx wrangler secret put TURNSTILE_SECRET
#
# The Worker FAILS CLOSED: it refuses to send (503) unless at least one anti-abuse
# control is configured — either TURNSTILE_SECRET (recommended) or the KV rate
# limiter below. This stops a fresh deploy from being an open email amplifier.
#
# !! ORDER MATTERS for Turnstile: do NOT set TURNSTILE_SECRET until index.html's
#    data-sitekey is replaced with the real Turnstile site key AND deployed. The
#    secret makes the challenge mandatory; if the page still has the
#    YOUR_TURNSTILE_SITE_KEY placeholder, no widget renders, no token is sent, and
#    EVERY submission is rejected 403. Replace the site key first (or in the same
#    change), then set the secret.

name = "templeoftwo-contact"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# The original route below could never fire: thetempleoftwo.com is managed by
# Webador, which does not permit changing nameservers, so Cloudflare cannot
# hold that zone. Verified 2026-08-07 — the apex resolves straight to GitHub
# Pages (server: GitHub.com, no cf-ray) and /api/contact returns 404/405 from
# GitHub, never reaching a Worker.
#
# routes = [
#   { pattern = "thetempleoftwo.com/api/contact", zone_name = "thetempleoftwo.com" }
# ]
#
# templetwo.com IS on this Cloudflare account (zone active, ns michelle/bart.
# ns.cloudflare.com — it already serves stack.templetwo.com). So the Worker
# takes a custom domain there instead: the site posts cross-origin, and
# ALLOWED_ORIGINS in src/worker.js already allowlists thetempleoftwo.com and
# its www variant. No *.workers.dev hostname is exposed, and thetempleoftwo.com
# DNS is never touched.
routes = [
  { pattern = "contact.templetwo.com", custom_domain = true }
]

# Cloudflare-native sending — no third-party account, no API key to rotate.
# Restricted to a single destination, so even a compromised Worker cannot mail
# anyone but the inbox this form is for. The address must be verified under
# Email Routing → Destination addresses before the first send will land.
send_email = [
  { name = "EMAIL", destination_address = "info@thetempleoftwo.com" }
]

[vars]
CONTACT_TO = "info@thetempleoftwo.com"
# The sender domain must be a zone on THIS Cloudflare account. thetempleoftwo.com
# is on Webador, so mail is sent from templetwo.com and lands in the Webador
# mailbox — receiving is unchanged, only the sending leg moved.
CONTACT_FROM = "Temple of Two <contact@templetwo.com>"

# Per-IP rate limit — 5 submissions per 10 minutes (RL_MAX / RL_WINDOW_SECONDS
# in src/worker.js). This binding is also what satisfies the Worker's
# fail-closed check, so without it every request returns 503 not_configured.
#
# NOTE: `RL` must stay a KV namespace. src/worker.js calls RL.get()/RL.put();
# Cloudflare's native Rate Limiting binding exposes only limit() and caps its
# window at 10 or 60 seconds, so swapping it in would satisfy the fail-closed
# check and then throw on the first real submission.
[[kv_namespaces]]
binding = "RL"
id = "2bfb953515a74867aa94104636971d14"
