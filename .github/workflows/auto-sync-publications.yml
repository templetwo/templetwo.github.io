name: Auto-sync publications

# Keeps the site from lagging behind data/publications.json.
# On a schedule (and on demand), re-runs scripts/sync_publications.py and
# commits any drift so GitHub Pages always ships the regenerated surfaces.
#
# Push/PR still get a pure verify (verify-publications-sync.yml) so hand-edits
# of AUTOGEN blocks are caught immediately; this job is the self-heal path.

on:
  schedule:
    # 12:00 UTC daily (~08:00 ET)
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/publications.json"
      - "scripts/sync_publications.py"

permissions:
  contents: write

concurrency:
  group: auto-sync-publications
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Need a token that can push to main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run publications sync
        run: python3 scripts/sync_publications.py

      - name: Commit and push if drift
        run: |
          if git diff --quiet; then
            echo "No drift — site already matches data/publications.json"
            exit 0
          fi
          git config user.name "temple-site-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(site): auto-sync publications surfaces from data/publications.json"
          git push origin HEAD:main
          echo "Pushed sync commit — Pages will rebuild from main"
