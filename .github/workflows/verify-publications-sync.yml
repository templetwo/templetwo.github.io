name: Verify publications sync

# Drift check: data/publications.json is the single source of truth for
# every DOI/publications surface on the site (JSON-LD in the five HTML
# pages, the DOI-count prose/stat counters, llms.txt, and the SVG
# publication-cadence timeline in publications.html). This workflow fails
# the build if any of those generated sections are out of sync with
# publications.json — i.e. someone added/edited a paper without running
# the sync script, or hand-edited a generated block directly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run publications sync (stdlib only, no dependencies)
        run: python3 scripts/sync_publications.py

      - name: Fail if the sync produced any changes
        run: |
          if ! git diff --exit-code; then
            echo ""
            echo "::error::Generated publications sections are out of sync with data/publications.json."
            echo "::error::Run 'python3 scripts/sync_publications.py' locally and commit the result."
            exit 1
          fi
